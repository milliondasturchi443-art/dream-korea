services:
  - type: web
    name: dream-korea
    env: node
    plan: free
    region: oregon
    branch: main
    # Seed avtomatik ishlamaydi — kerak bo'lsa Render Shell'da bir marta: npm run seed
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
